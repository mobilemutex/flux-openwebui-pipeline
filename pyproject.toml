readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=0.20.0",
    "aiohttp>=3.8.4",
    "asyncio>=3.4.3",
    "diffusers>=0.33.1",
    "fastapi>=0.95.0",
    "pillow>=9.0.0",
    "protobuf>=6.30.2",
    "pydantic>=2.0.0",
    "pytest>=7.3.1",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
    "sentencepiece>=0.2.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "uvicorn>=0.22.0",
]
